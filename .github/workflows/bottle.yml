name: Build bottles

# Manual only -- a full run builds FreeFEM + PETSc/SLEPc from source on
# every matrix OS (~30-45 min each), so it's triggered deliberately
# (Actions tab -> "Build bottles" -> "Run workflow", or
# `gh workflow run bottle.yml`) rather than on every push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Resolve this tap's expected path
        run: echo "TAP_PATH=$(brew --repo olivierpironneau/freefem)" >> "$GITHUB_ENV"

      # Check out directly into Homebrew's own expected tap location, so
      # `olivierpironneau/freefem/freefem` resolves immediately -- no
      # separate network `brew tap` clone needed.
      - uses: actions/checkout@v4
        with:
          path: ${{ env.TAP_PATH }}

      - name: Build
        run: brew install --build-bottle --verbose olivierpironneau/freefem/freefem

      - name: Test
        run: brew test olivierpironneau/freefem/freefem

      - name: Bottle
        run: brew bottle --json --root-url="https://github.com/${{ github.repository }}/releases/download/bottles" olivierpironneau/freefem/freefem

      - name: Rename bottle to the single-dash filename brew's root_url resolution expects
        run: |
          for f in *.bottle*.tar.gz; do
            mv "$f" "${f/freefem--/freefem-}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.runner }}
          path: |
            *.bottle*.tar.gz
            *.bottle*.json
          if-no-files-found: error

  publish:
    needs: bottle
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Resolve this tap's expected path
        run: echo "TAP_PATH=$(brew --repo olivierpironneau/freefem)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          path: ${{ env.TAP_PATH }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/update the "bottles" release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bottles --repo "${{ github.repository }}" ||
            gh release create bottles --repo "${{ github.repository }}" \
              --title "Bottles" \
              --notes "Prebuilt bottles for the freefem formula. Managed by .github/workflows/bottle.yml -- assets are overwritten on each run, not versioned per-release."
          find artifacts -name '*.bottle*.tar.gz' -exec \
            gh release upload bottles {} --repo "${{ github.repository }}" --clobber \;

      - name: Merge per-OS bottle hashes into the formula and commit
        run: |
          cd "$TAP_PATH"
          json_files=()
          while IFS= read -r f; do json_files+=("$f"); done < <(find "$GITHUB_WORKSPACE/artifacts" -name '*.bottle*.json')
          brew bottle --merge --write --no-commit "${json_files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/freefem.rb
          if git diff --cached --quiet; then
            echo "No bottle hash changes to commit"
          else
            git commit -m "Update bottle hashes [skip ci]"
            git push
          fi
